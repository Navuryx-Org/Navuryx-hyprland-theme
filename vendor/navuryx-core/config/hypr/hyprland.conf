$mainMod = SUPER
$terminal = ~/.config/navuryx/bin/navuryx-terminal
$bin = ~/.config/navuryx/bin
$files = bash -lc 'command -v dolphin >/dev/null && exec dolphin || command -v thunar >/dev/null && exec thunar || command -v nautilus >/dev/null && exec nautilus || exec kitty -e lf'
$editor = bash -lc 'command -v code >/dev/null && exec code || command -v codium >/dev/null && exec codium || command -v nvim >/dev/null && exec kitty -e nvim || exec kitty'
$browser = xdg-open https://duckduckgo.com

monitor=,preferred,auto,auto

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita-dark

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = bash -lc 'if [ -x "$HOME/.config/waybar/launch.sh" ]; then "$HOME/.config/waybar/launch.sh"; else waybar; fi'
exec-once = ~/.config/navuryx/bin/navuryx-wallpaper --restore
exec-once = ~/.config/navuryx/bin/navuryx-appearance --apply
exec-once = ~/.config/navuryx/bin/navuryx-shell-config ensure-workspaces
exec-once = ~/.config/navuryx/bin/navuryx-autostart-helpers
exec-once = ~/.config/navuryx/bin/navuryx-clipboard-watch
exec-once = ~/.config/navuryx/bin/navuryx-polkit
exec-once = bash -lc 'command -v qs >/dev/null && qs -c navuryx || command -v quickshell >/dev/null && quickshell -c navuryx || true'
exec-once = ~/.config/navuryx/bin/navuryx-welcome

workspace = 1, persistent:true, default:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true
workspace = 10, persistent:true

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(3558D4ff) rgba(7A24C9ff) 45deg
    col.inactive_border = rgba(12122aaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    rounding_power = 2
    active_opacity = 0.985
    inactive_opacity = 0.93

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(010106cc)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.18
        new_optimizations = true
        xray = true
    }
}

animations {
    enabled = true
    bezier = navuryxEase, 0.22, 1, 0.36, 1
    bezier = navuryxFast, 0.16, 1, 0.3, 1
    animation = global, 1, 8, navuryxEase
    animation = windows, 1, 5.2, navuryxEase, popin 88%
    animation = windowsIn, 1, 4.5, navuryxEase, popin 88%
    animation = windowsOut, 1, 2.2, navuryxFast, popin 88%
    animation = border, 1, 5, navuryxEase
    animation = fade, 1, 4, navuryxFast
    animation = layers, 1, 4, navuryxEase
    animation = workspaces, 1, 4, navuryxEase, slide
}

dwindle {
    preserve_split = true
    smart_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace
gesture = 3, swipe, move
gesture = 3, pinch, fullscreen

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = CTRL ALT, T, exec, $terminal
bind = $mainMod, E, exec, $files
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, $editor
bind = $mainMod, SPACE, exec, $bin/navuryx-spotlight
bind = $mainMod CTRL, RETURN, exec, $bin/navuryx-spotlight
bind = $mainMod SHIFT, SPACE, exec, $bin/navuryx-command
bind = $mainMod, A, exec, $bin/navuryx-ai
bind = $mainMod ALT, A, exec, $bin/navuryx-ask-screen
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT ALT, Q, exec, hyprctl kill
bind = $mainMod ALT, SPACE, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, D, fullscreen, 1
bind = $mainMod, P, pin,
bind = $mainMod, L, exec, bash -lc 'loginctl lock-session || hyprlock'
bind = $mainMod SHIFT, L, exec, bash -lc 'systemctl suspend || loginctl suspend'
bind = $mainMod, V, exec, $bin/navuryx-clipboard
bind = $mainMod, W, exec, $bin/navuryx-wallpaper
bind = $mainMod CTRL, W, exec, $bin/navuryx-wallpaper
bind = $mainMod SHIFT, W, exec, $bin/navuryx-wallpaper --random
bind = $mainMod CTRL, T, exec, $bin/navuryx-wallpaper --random
bind = $mainMod, comma, exec, $bin/navuryx-settings
bind = $mainMod SHIFT, S, exec, $bin/navuryx-screenshot
bind = $mainMod ALT, S, exec, $bin/navuryx-screenshot --menu
bind = $mainMod SHIFT, X, exec, $bin/navuryx-screenshot ocr
bind = $mainMod ALT, R, exec, $bin/navuryx-record
bind = $mainMod SHIFT, R, exec, $bin/navuryx-record
bind = $mainMod SHIFT, E, exec, $bin/navuryx-power
bind = $mainMod CTRL, P, exec, $bin/navuryx-power --rofi
bind = CTRL ALT, Delete, exec, $bin/navuryx-power
bind = $mainMod, N, exec, $bin/navuryx-control
bind = $mainMod, I, exec, $bin/navuryx-settings
bind = $mainMod, TAB, exec, $bin/navuryx-overview
bind = $mainMod SHIFT, N, exec, $bin/navuryx-notifications
bind = $mainMod SHIFT, T, exec, $bin/navuryx-theme
bind = $mainMod, K, exec, $bin/navuryx-keybinds
bind = $mainMod SHIFT, V, exec, $bin/navuryx-vpn
bind = $mainMod SHIFT, G, exec, $bin/navuryx-gaming
bind = $mainMod SHIFT, M, exec, $bin/navuryx-spotify
bind = $mainMod ALT, period, exec, $bin/navuryx-wallpaper --next
bind = $mainMod ALT, comma, exec, $bin/navuryx-wallpaper --random
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = , Print, exec, $bin/navuryx-screenshot
bind = CTRL $mainMod SHIFT, D, exec, $bin/navuryx-appearance --toggle
bind = $mainMod SHIFT ALT, slash, exec, $bin/navuryx-welcome --force

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d
bind = $mainMod, J, togglesplit,
binde = $mainMod, semicolon, splitratio, -0.1
binde = $mainMod, apostrophe, splitratio, +0.1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

bind = $mainMod, S, togglespecialworkspace, scratch
bind = $mainMod ALT, S, movetoworkspacesilent, special:scratch
bind = $mainMod, grave, togglespecialworkspace, scratch
bind = $mainMod SHIFT, grave, movetoworkspace, special:scratch
bind = CTRL $mainMod, left, workspace, r-1
bind = CTRL $mainMod, right, workspace, r+1

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, $bin/navuryx-osd volume-up
bindel = , XF86AudioLowerVolume, exec, $bin/navuryx-osd volume-down
bindl = , XF86AudioMute, exec, $bin/navuryx-osd mute
bindl = , XF86AudioMicMute, exec, $bin/navuryx-osd mic-mute
bindel = , XF86MonBrightnessUp, exec, $bin/navuryx-osd brightness-up
bindel = , XF86MonBrightnessDown, exec, $bin/navuryx-osd brightness-down
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrulev2 = float, title:^(Open File|Save File|Picture-in-Picture)$
windowrulev2 = center, title:^(Open File|Save File|Picture-in-Picture)$
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = center, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = size 900 600, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = float, class:^(navuryx-ai)$
windowrulev2 = center, class:^(navuryx-ai)$
windowrulev2 = size 1000 700, class:^(navuryx-ai)$
windowrulev2 = float, class:^(wlogout)$
windowrulev2 = fullscreen, class:^(wlogout)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-500 100%-300, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Navuryx Settings|Navuryx Welcome)$
windowrulev2 = center, title:^(Navuryx Settings|Navuryx Welcome)$
windowrulev2 = size 980 680, title:^(Navuryx Settings|Navuryx Welcome)$
windowrulev2 = suppressevent maximize, class:.*
