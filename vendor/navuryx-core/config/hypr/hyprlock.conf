general {
    hide_cursor = true
    immediate_render = true
}
background {
    monitor =
    path = $HOME/.config/navuryx/wallpapers/wallpaper.png
    blur_passes = 4
    blur_size = 8
    color = rgba(020208ff)
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(b8c0e8ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(5c5c88ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(3558d4ff)
    inner_color = rgba(080812ee)
    font_color = rgba(b8c0e8ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##5c5c88">Password</span>
    hide_input = false
    rounding = 18
    check_color = rgba(7a24c9ff)
    fail_color = rgba(e04570ff)
    position = 0, -100
    halign = center
    valign = center
}
