$mod = SUPER
bind = $mod, SPACE, exec, navuryx spotlight
bind = $mod, A, exec, navuryx ai
bind = $mod, TAB, exec, navuryx overview
bind = $mod SHIFT, TAB, exec, navuryx task-view
bind = $mod, N, exec, navuryx control-center
bind = $mod SHIFT, N, exec, navuryx notifications
bind = $mod, I, exec, navuryx settings
bind = $mod, V, exec, navuryx clipboard
bind = $mod, E, exec, xdg-open ~
bind = $mod, RETURN, exec, kitty
bind = $mod SHIFT, S, exec, navuryx capture region
bind = $mod SHIFT, R, exec, navuryx record
bind = $mod SHIFT, T, exec, navuryx theme
bind = $mod SHIFT, W, exec, navuryx wallpaper
bind = $mod SHIFT, V, exec, navuryx vpn
bind = $mod SHIFT, G, exec, navuryx gaming
bind = $mod, ESCAPE, exec, navuryx power
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
