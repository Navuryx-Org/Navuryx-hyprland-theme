general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(4169E1ff) rgba(8B5CF6ff) 45deg
  col.inactive_border = rgba(10182Baa)
  layout = dwindle
}
decoration {
  rounding = 12
  active_opacity = 1.0
  inactive_opacity = 0.96
  blur { enabled = true; size = 8; passes = 3 }
  shadow { enabled = true; range = 20; render_power = 3; color = rgba(00000088) }
}
animations {
  enabled = true
  bezier = navuryx, 0.16, 1, 0.3, 1
  animation = windows, 1, 5, navuryx, popin 80%
  animation = workspaces, 1, 5, navuryx, slide
}
